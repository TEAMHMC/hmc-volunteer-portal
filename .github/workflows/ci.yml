name: CI

# PR gate for the volunteer portal. Runs on every pull request into main and on
# pushes to the staging branch. Must pass before a PR can be merged once branch
# protection is enabled (see docs/staging.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [staging]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (client + server)
        run: npm run build

      # Fail the build if a hard-coded API key / secret pattern is committed.
      # Scans source only (not deps, build output, or lockfiles). Tuned to the
      # key shapes this project uses: Google API keys (AIza...), Firebase
      # service-account private keys, and long hex/JWT-looking secrets.
      - name: Secret scan
        run: |
          set -e
          PATTERN='AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|"private_key":|sk-[A-Za-z0-9]{20,}'
          if grep -rEn --binary-files=without-match \
               --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
               --exclude='*.lock' --exclude='package-lock.json' \
               "$PATTERN" src public 2>/dev/null; then
            echo "::error::Potential hard-coded secret found in source. Move it to Secret Manager / env vars."
            exit 1
          fi
          echo "No hard-coded secrets detected."
